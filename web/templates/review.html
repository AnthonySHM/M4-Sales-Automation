{% extends "base.html" %}
{% block title %}Review Job {{ job_id }}{% endblock %}
{% block content %}
<h1>Review Job {{ job_id }}</h1>
<p>Status: <strong>{{ status }}</strong></p>
{% if error %}
<div class="error-block">
  <p class="error">{{ error }}</p>
</div>
{% endif %}
<form method="POST" action="/jobs/{{ job_id }}/review">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div>
    <label for="reason">Rejection reason (required if rejecting):</label><br>
    <textarea name="reason" id="reason" rows="4" cols="60"></textarea>
  </div>
  <div>
    <button type="submit" name="decision" value="approved">Approve</button>
    <button type="submit" name="decision" value="rejected">Reject</button>
  </div>
</form>
{% endblock %}
