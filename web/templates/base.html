<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}M4 Sales Automation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>

<nav>
    <strong><a href="/">M4 Sales Automation</a></strong>
    <a href="/">Home</a>
    <a href="/jobs">Dashboard</a>
    <a href="/jobs/new">Submit Job</a>
</nav>

<main>
    {# Flash message block — populated by routes that set request.session["flash"] #}
    {% if flash_messages is defined %}
        {% for message in flash_messages %}
            <div class="flash flash-{{ message.level }}">{{ message.text }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
